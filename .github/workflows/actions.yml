name: Print Dynamical Message

on :
    push:
        branches:
            - main
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
        - name: Print message
          run:
               echo "Hello, ${{github.actor}}!! Welcome to the GitHub Actions workflow."
               echo "You pushed to the branch ${{github.ref}}"
               echo "from repository ${{github.repository}}"
               echo "at $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')"