name: Handle Issues

on:
    issues:
        types: [opened, edited]
jobs:
    log-issue:
        runs-on: ubuntu-latest
        steps:
            - name: Log Issue Details
              run: |
                  echo "Issue Title: ${{ github.event.issue.title }}"
                  echo "Issue Body: ${{ github.event.issue.body }}"
                  echo "${{ toJSON(github.event) }}"